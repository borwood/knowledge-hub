name: knowledge-hub
services:
  identity:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:8080"]
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run setup_local.py}
      DEMO_ALICE_PASSWORD: ${DEMO_ALICE_PASSWORD:?Run setup_local.py}
      DEMO_BOB_PASSWORD: ${DEMO_BOB_PASSWORD:?Run setup_local.py}
    volumes:
      - identity-data:/opt/keycloak/data
      - ./identity/hub-realm.json:/opt/keycloak/data/import/hub-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/hub/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ \"$$status\" == *'200 OK'* ]]"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-ip=storage", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set local credentials in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set local credentials in .env}
      S3_BUCKET: knowledge-hub
    volumes:
      - object-data:/data
    ports:
      - "127.0.0.1:8333:8333"
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SQLITE_PATH: /data/knowledge-hub.db
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: knowledge-hub
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set local credentials in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set local credentials in .env}
      WEB_ORIGIN: http://127.0.0.1:3000
      OIDC_ISSUER: http://127.0.0.1:8080/realms/hub
      OIDC_BACKCHANNEL: http://identity:8080/realms/hub
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run setup_local.py}
    volumes:
      - sqlite-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - storage
      - identity
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  sqlite-data:
  object-data:
  identity-data:
